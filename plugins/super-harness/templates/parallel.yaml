# super-harness 并行调度配置（/super-harness:run 用；/super-harness:init 首次投放到
# .claude/harness/parallel.yaml，之后 init / update 都不会覆盖）。
# 单路的 /super-harness:run-inline 不读这个文件。

# 同时运行的 worker 数。每一路是一个独立的 claude 进程 + 一个 worktree，
# token 消耗大致按路数线性增长。建议先用 2，跑顺了再加。
max_slots: 2

# 依赖来源，优先级从高到低：本文件的 deps_overrides → sprint-status.yaml 顶层的
# story_dependencies（推荐，BMad 6.12.4 的脚本只认单行写法，依赖写在这里）→
# development_status 多行块里的 depends_on。依赖里 ext- 开头的项是外部条件，
# 永远不会自动满足，条件满足后从依赖里删掉。
# 三处都没声明依赖的 story 怎么处理：
#   serial         当作依赖它前面所有 story（效果等于一次一条），默认
#   epic-parallel  同一 epic 内视为互相独立，只受 epic 屏障约束
# 写了 depends_on 的 story（包括 depends_on: []）总是按声明来。
no_deps_policy: serial

# epic N 的 story 要等 epic 1..N-1 的 story 全部完成才启动（挂起状态的 story 不算，
# 见 harness-project-config.yaml 的 parked_statuses）。依赖写全的项目可以设成 false：
# 只按依赖调度，允许跨 epic 并行；retro 仍然按 epic 在该 epic 全部完成后跑。
epic_barrier: true

# epic N 的 story 要等 epic 1..N-1 的 retrospective 为 done 才启动（epic_barrier 为 true 时才生效）。
retro_barrier: true

# 一路停下来等人（受阻、失败、合流挂起、合流冲突）时，后面的 story 怎么办：
#   wait      它照样挡住串行顺序、epic 屏障和 retro 屏障（默认，和 0.3.x 一样）
#   continue  不再挡这几样，后面不依赖它的 story 照常派发；depends_on 写明依赖它的仍然等，
#             它所在 epic 的 retro 也等它处理完才跑
blocked_policy: wait

# worker 遇到 intent gap 这类有推荐读法的问题时：
#   proceed  按 answer-policy 选推荐项写进 spec 接着跑，决定进收件箱（superh.py decisions），
#            你有空时批量确认或推翻（默认）
#   ask      停下，lane 记为受阻，等你回答
# 对外发布、破坏性操作、硬闸门口径这几类不受这个开关影响，总是停下来问。
decision_mode: proceed

# lane worktree 放在哪。空 = <仓库上级目录>/<仓库名>.worktrees
worktree_root: ''

# lane 分支名前缀，分支名 = <前缀><story key>
branch_prefix: story/

# 主 worktree 里存在、但没进 git 的路径，开 lane 时复制进去（已在 worktree 里的不动）。
# .claude/harness 下的脚本按自身文件位置推算仓库根目录，所以它必须复制，不能软链。
copy_paths:
  - .claude/harness
  - .claude/skills
  - _bmad
  - .claude/settings.local.json

# 体积大、只读的路径用软链，例如 node_modules。
# 补进 lane 的路径都必须被项目 .gitignore 忽略；软链要写成不带结尾斜杠的 /node_modules，
# node_modules/ 匹配不到软链。/super-harness:init 会用 superh.py doctor 检查。
link_paths: []

# lane worktree 准备好后在其中执行一次的命令（sh -c），例如 'pnpm install --frozen-lockfile'。
# 环境变量：SUPERH_KEY / SUPERH_WORKTREE / SUPERH_MAIN_ROOT
# 超时后整个进程组（包括命令自己再起的子进程）都会被结束，这一路记为 held。
prepare_command: ''
prepare_timeout_sec: 600

# 合流验证命令（sh -c），例如 'go test ./... && pnpm --filter web test'。
# integrate 把 lane rebase 到 sprint 分支最新提交、build-verify 通过之后，在 lane
# worktree 里跑一次，这时 lane 的代码和合流后的 sprint 分支一模一样。失败时这一路
# 记为 held，sprint 分支不动；在 lane worktree 里修好并 commit，再重跑 integrate。
# 没有被 rebase 的 lane 不跑（代码没变，B1 已经验过）。留空 = 不验证。
# 环境变量同 prepare_command。lane 用 link_paths 软链了依赖目录时，命令里别写会改动它的步骤。
# 超时算作验证失败，处理方式同上，命令起的整个进程组都会被结束。
verify_command: ''
verify_timeout_sec: 1800
# verify_command 超时后自动重跑几次（偶发挂住的测试）。命令自己失败（exit 非 0）不重跑。
verify_timeout_retries: 1

# 前置环境（数据库、集成环境等），worker 启动前和 verify_command 之前检查（sh -c，在主 worktree 里执行）。
# env_check_command 退出码 0 = 就绪；不就绪时执行一次 env_up_command 再检查，还不行这一路记为 held。
# 只配 env_up_command 时每次都执行它，所以它要能重复执行（例如 docker compose up -d）。
# env_down_command 在整个 sprint 跑完（end-run --finished）时执行。留空 = 不管环境。
env_check_command: ''
env_up_command: ''
env_down_command: ''
env_timeout_sec: 600

# 独占资源（issue #22）：全机只有一份、不能两路同时用的东西，例如集成环境、压测要独占的 CPU 核。
# 键是 story key 或 glob，值是资源名列表。tick 保证同一个资源同一时间只派给一路：一路从 prepare
# 起占着它，直到合入 sprint 分支（或 abandon）；停下来等人的那一路也继续占着。不想规定先后顺序、
# 只想不同时跑的 story 用这里，不要用 deps_overrides 串起来。
# resource_acquire：第一条要用这个资源的 story 启动 worker 之前执行一次（sh -c，在主 worktree）；
# resource_release：没有未完成的 story 还要用它时执行（story 收口 mark done、abandon、end-run --finished）。
# 留空 = 只做互斥，不起停任何东西。命令超时用 hook_timeout_sec。
# resources:
#   2-3-*: [bench-cores]
#   2-4-*: [integration-env, bench-cores]
# resource_acquire:
#   integration-env: 'tools/env up'
# resource_release:
#   integration-env: 'tools/env down'

# lane 收尾钩子（issue #26，sh -c，在主 worktree 执行，默认留空）：
#   lane_cleanup_command  cleanup / abandon 删 lane worktree 之前执行，环境变量多一个 SUPERH_BRANCH。
#                         例如几路共用一个构建缓存目录时，删掉这一路自己的产物。
#   post_epic_command     epic retro 之后、没有 lane 在跑的时候执行一次（SUPERH_EPIC=<N>），
#                         例如整删共享构建缓存。还有 lane 在跑时会等它们结束，期间不派发新 worker。
# 这两个命令通常会删文件，写之前先确认删的范围。失败只告警，不挡流水线。
# 共用 cargo target 目录的注意：target/debug/ 顶层的可执行文件（集成测试的 CARGO_BIN_EXE_* 指向
# 它们）文件名里没有 hash，几路会互相覆盖；同一个 target 目录上的 cargo 构建还会抢同一把文件锁。
lane_cleanup_command: ''
post_epic_command: ''
hook_timeout_sec: 1800

# 磁盘余量（issue #31）。几路并行编译、共用构建缓存时，分区可能在一个 epic 里被写满。
# disk_check_paths 里任何一个分区的可用空间低于 disk_min_free_gb（单位 GB），就不再派发新 lane，
# 合流也先不做（verify_command 要编译），看板写明原因和当前余量；在跑的 lane 不受影响。
# 余量回来后自动恢复。0 = 不检查。
# 默认 auto：10G，但不超过该分区容量的 10%（小分区不会一直被判为不足）。写数字就按数字算，
# 按「一路产物的大小 × 并行路数」再留点余量来定；Rust / C++ 这类一路产物几十 G 的项目要调高。
# disk_check_paths 留空 = worktree_root 和主 worktree 所在的分区；构建缓存放在别处（例如共用的
# CARGO_TARGET_DIR）时把那个目录也写进来。同一分区只算一次。
# disk_cleanup_command：余量不足、并且没有 lane 在跑（working / prepare / integrate）时执行一次
# （sh -c，在主 worktree；环境变量 SUPERH_DISK_PATHS、SUPERH_DISK_MIN_FREE_GB）。执行后余量仍不够，
# 等余量回到阈值以上之前不会再执行，需要人工腾空间。超时用 hook_timeout_sec。留空 = 不自动清理。
# worker 或合流验证因磁盘写满失败时，这一路记为 disk_full，不算代码问题，余量回来后自动重试（每路最多 2 次）。
disk_check_paths: []
disk_min_free_gb: auto
disk_cleanup_command: ''

# worker（headless claude -p）的权限模式。无人值守需要 bypassPermissions；
# 改成更严格的模式时，worker 会在需要授权的地方失败退出。
worker_permission_mode: bypassPermissions
# worker 用的模型，例如 opus、sonnet，或完整模型 id。worker 里 bmad-build-auto 派的子 agent 继承这个模型。
# 建议写死。留空 = 跟随 ~/.claude/settings.json 的 model，这个文件全机共享，别的仓库的会话执行一次
# /model 就会改掉它。start-run 在留空时会提醒，launch 会输出 worker 实际用的模型。
worker_model: ''
claude_bin: claude

# story done 之后保留 worktree 和分支（调试用）
keep_worktrees: false

# 手工补充 / 覆盖依赖，优先于 sprint-status.yaml 的 story_dependencies 和 depends_on。
# 值可以是 story key、短号（3.2 或 3-2）、epic-N。
# deps_overrides:
#   3-4-export-csv: [3-2-digest-delivery]
#   3-5-audit-log: []
